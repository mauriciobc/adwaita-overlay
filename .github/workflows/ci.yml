name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # libadwaita moves independently of this repo: the forward contract axis in
  # the `arch` job is the early warning, so run it weekly even without pushes.
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5

  # Distro-neutral: compile with sassc, run the hermetic reverse axis
  # (`meson test`), and prove `meson dist` produces a tarball that builds and
  # tests on its own. No libadwaita needed.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y meson sassc gawk
      - name: Build and test
        run: |
          meson setup _build --prefix=/usr
          meson compile -C _build
          meson test -C _build --print-errorlogs
      - name: Dist
        run: meson dist -C _build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: _build/meson-dist/*

  # Arch: build the real package from the dist tarball. check() runs the
  # forward contract axis against the CURRENT libadwaita, so this job turns
  # red when an upstream release moves a selector or variable the sheet needs.
  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed base-devel git meson sassc libadwaita glib2 gawk sed grep
      - uses: actions/checkout@v4
      - name: Dist tarball
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          meson setup /tmp/dist-build
          meson dist -C /tmp/dist-build --no-tests
      - name: makepkg
        run: |
          useradd -m builder
          install -d -o builder /tmp/pkg
          cp packaging/arch/* /tmp/dist-build/meson-dist/adwaita-overlay-*.tar.xz /tmp/pkg/
          chown -R builder /tmp/pkg
          # No release exists to download yet: use the local tarball.
          sed -i 's|^source=.*|source=("$pkgname-$pkgver.tar.xz")|' /tmp/pkg/PKGBUILD
          su builder -c 'cd /tmp/pkg && makepkg -f --noconfirm'
      - name: Package contents
        run: bsdtar -tf /tmp/pkg/*.pkg.tar.zst
